<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simple Landing Page</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      color: #111;
      background: #fff;
    }

    .hero {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 40px 20px;
    }

    .content {
      max-width: 650px;
    }

    h1 {
      font-size: 52px;
      margin-bottom: 20px;
    }

    p {
      font-size: 20px;
      line-height: 1.6;
      color: #555;
      margin-bottom: 30px;
    }

    .button {
      display: inline-block;
      padding: 14px 24px;
      background: #111;
      color: white;
      text-decoration: none;
      border-radius: 6px;
    }

    .button:hover {
      background: #333;
    }

    @media (max-width: 600px) {
      h1 {
        font-size: 38px;
      }

      p {
        font-size: 18px;
      }
    }
  </style>
</head>

<body>

  <section class="hero">
    <div class="content">
      <h1>Build something great.</h1>

      <p>
        A simple solution that helps you save time,
        work smarter, and focus on what matters.
      </p>

      <a href="#start" class="button">Get Started</a>
    </div>
  </section>

</body>
</html>
